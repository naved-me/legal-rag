<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Legal Assistant</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">⚖️</div>
                <h1>MotorLegal.ai</h1>
            </div>
            <p class="subtitle">Your intelligent legal assistant for Motor Laws and Regulations.</p>

            <button id="new-chat-btn" class="secondary-btn">+ New Chat</button>

            <div class="sessions-label">Recent Chats</div>
            <div id="session-list" class="session-list"></div>

            <div class="info-card">
                <h3>API Key</h3>
                <input type="password" id="api-key-input" placeholder="Optional (empty = no auth)" autocomplete="off">
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <!-- Messages will be injected here -->
            <div class="messages-wrapper" id="chat-messages">
                <div class="message ai-message welcome-message">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                        <p>Hello! I am a highly trained legal assistant specializing in Motor Laws. How can I help you today?</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Ask a legal question (e.g., Penalty for driving without a license?)..." autocomplete="off" required>
                    <button type="submit" id="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
